[project]
name = "ai-ml"
version = "0.1.0"
description = "AI/ML environment for daily exercises"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.6.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "openai>=2.50.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
